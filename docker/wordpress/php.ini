file_uploads = On
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 600
client_max_body_size =  128M

; Check changed PHP files on every request, so a rebuilt asset file or an
; edited template shows at once rather than up to 2 seconds later
opcache.revalidate_freq = 0

; Log PHP errors to the container output, as hosts do. WordPress sends them to
; its debug log instead when WP_DEBUG_LOG is set, as in development
log_errors = On
