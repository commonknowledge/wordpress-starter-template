name: Check Docker Compose development environment
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          php_version: "8.5"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/app/themes/wordpress-starter-template/.nvmrc
          cache: npm
          cache-dependency-path: web/app/themes/wordpress-starter-template/package-lock.json

      - name: Build theme assets
        working-directory: web/app/themes/wordpress-starter-template
        run: npm ci && npm run build

      - name: Setup environment file with database settings
        run: cp .env.example .env

      - name: Build the stack
        run: docker compose up -d --build

      - name: Install WordPress, activate the theme and load page fixtures
        run: scripts/setup.sh http://localhost:8082 "WordPress Starter"

      - name: Test WordPress is running successfully
        run: >
          scripts/smoke-test.sh "WordPress Starter" http://localhost:8082
          "/blocks/=wp-block-wordpress-starter-template-example"
          "/blocks/=Hello from a custom block"

      - name: Test the theme's main.js dependencies are loaded
        run: scripts/test-theme-assets.sh http://localhost:8082

      - name: Test the setup script
        run: scripts/test-setup.sh http://localhost:8082 "WordPress Starter"

      - name: Test every plugin activates
        run: scripts/test-plugins.sh http://localhost:8082

      - name: Install the browser for browser tests
        working-directory: web/app/themes/wordpress-starter-template
        run: npx playwright install --with-deps chromium

      # Runs with every plugin active, after the plugin test
      - name: Test the front end, block editor and Site Editor in a browser
        working-directory: web/app/themes/wordpress-starter-template
        run: npm run test:e2e
        env:
          SITE_URL: http://localhost:8082

      - name: Upload the browser test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/app/themes/wordpress-starter-template/playwright-report/
            web/app/themes/wordpress-starter-template/test-results/
          retention-days: 7

      # Covers every page the tests above loaded, so it runs even if one failed
      - name: Check PHP logged no errors
        if: success() || failure()
        run: scripts/check-php-log.sh
