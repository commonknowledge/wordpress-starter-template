name: Check Docker Compose development environment
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          php_version: "8.5"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/app/themes/wordpress-starter-template/.nvmrc
          cache: npm
          cache-dependency-path: web/app/themes/wordpress-starter-template/package-lock.json

      - name: Build theme assets
        working-directory: web/app/themes/wordpress-starter-template
        run: npm ci && npm run build

      - name: Setup environment file with database settings
        run: cp .env.example .env

      - name: Start the local proxy
        run: |
          scripts/proxy.sh
          echo "127.0.0.1 wordpress-starter-template.test" | sudo tee -a /etc/hosts

      - name: Build the stack
        run: docker compose up -d --build

      - name: Install WordPress, activate the theme and load page fixtures
        run: scripts/setup.sh http://wordpress-starter-template.test "WordPress Starter"

      - name: Test WordPress is running successfully
        run: >
          scripts/smoke-test.sh "WordPress Starter" http://wordpress-starter-template.test
          "/blocks/=wp-block-wordpress-starter-template-example"
          "/blocks/=Hello from a custom block"

      - name: Test the theme's main.js dependencies are loaded
        run: scripts/test-theme-assets.sh http://wordpress-starter-template.test

      - name: Test the setup script
        run: scripts/test-setup.sh http://wordpress-starter-template.test "WordPress Starter"
