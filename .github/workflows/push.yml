name: Check Docker Compose development environment
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          php_version: "8.5"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: web/app/themes/wordpress-starter-template/.nvmrc
          cache: npm
          cache-dependency-path: web/app/themes/wordpress-starter-template/package-lock.json

      - name: Build theme assets
        working-directory: web/app/themes/wordpress-starter-template
        run: npm ci && npm run build

      - name: Setup environment file with database settings
        run: cp .env.example .env

      - name: Build the stack
        run: docker compose up -d --build

      - name: Wait for MariaDB to come up
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T mysql mariadb -uroot -ppassword -e 'SELECT 1' && exit 0
            sleep 2
          done
          exit 1

      - name: Install WordPress
        run: >
          docker compose exec -T wordpress wp core install
          --url=http://localhost:8082
          --title="WordPress Starter"
          --admin_user=admin
          --admin_password=admin
          --admin_email=admin@example.com
          --skip-email

      - name: Activate the theme and add a page using the example block
        run: |
          docker compose exec -T wordpress wp theme activate wordpress-starter-template
          docker compose exec -T wordpress wp rewrite structure '/%postname%/'
          docker compose exec -T wordpress wp post create --post_type=page --post_status=publish \
            --post_title=Blocks --post_name=blocks \
            --post_content='<!-- wp:wordpress-starter-template/example /-->'

      - name: Test WordPress is running successfully
        run: >
          scripts/smoke-test.sh "WordPress Starter" http://localhost:8082
          "/blocks/=wp-block-wordpress-starter-template-example"
          "/blocks/=Hello from a custom block"
