services:
  nginx:
    image: nginx:1.31
    container_name: wordpress-starter-template-nginx
    # Served at http://$LOCAL_DOMAIN (set in .env) by the shared local proxy
    # in docker/proxy, rather than on a host port
    labels:
      - traefik.enable=true
      - traefik.http.routers.wordpress-starter-template.rule=Host(`${LOCAL_DOMAIN:?Set LOCAL_DOMAIN in .env}`)
      - traefik.http.routers.wordpress-starter-template.entrypoints=web
    networks:
      default:
        # Lets WordPress reach its own URL, for cron and loopback requests
        aliases:
          - ${LOCAL_DOMAIN:?Set LOCAL_DOMAIN in .env}
      local-proxy:
    volumes:
      - ./docker/nginx/config:/etc/nginx/conf.d
      - ./:/var/www/html:rw,cached
      - ./docker/nginx/certs:/etc/certs
    depends_on:
      - wordpress

  mysql:
    image: mariadb:12.3
    container_name: wordpress-starter-template-mysql
    volumes:
      - wordpress-starter-template-mysql:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=wordpress-starter-template
    # A free port picked by Docker, found with `docker compose port mysql 3306`,
    # unless DB_HOST_PORT is set
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-}:3306"

  wordpress:
    container_name: wordpress-starter-template-wordpress
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html:rw,cached
      - ./docker/wordpress/php.ini:/usr/local/etc/php/conf.d/php.ini
    environment:
      - WP_CLI_ALLOW_ROOT=true
      - PAGER=more
    depends_on:
      - mysql
    extra_hosts:
      - "host.docker.internal:host-gateway"

  composer:
    image: composer:2
    working_dir: /var/www/html
    restart: "no"
    volumes:
      - ./:/var/www/html:rw,cached

networks:
  local-proxy:
    external: true

volumes:
  wordpress-starter-template-mysql:
